        .code-container {
            font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
            background-color: #ffffff;
            color: #000000;
        }
        .code-line {
            display: flex;
            align-items: center;
            padding: 1px 8px;
            cursor: pointer;
            user-select: none;
            line-height: 1.5;
            font-size: 0.9rem;
        }
        .code-line:hover {
            background-color: #e8f4fe;
        }
        .code-line.selected {
            background-color: #cce5ff;
            border-left: 4px solid #0066cc;
        }
        .line-num {
            width: 2.5rem;
            color: #7a7a7a;
            text-align: right;
            padding-right: 1rem;
            font-size: 0.85rem;
        }
        /* C++ 語法高亮 (Dev-C++ / Visual Studio 風格) */
        .keyword { color: #0000ff; font-weight: bold; }       /* int, char, if, else, return */
        .directive { color: #008000; font-weight: bold; }     /* #include */
        .string { color: #0000ff; }                          /* "字串" */
        .character { color: #0000ff; }                       /* 'y', 'Y' */
        .comment { color: #0080ff; font-style: italic; }     /* // 註解 */
    </style>
</head>

        <div>
            <h1 class="text-2xl font-bold text-cyan-400 flex items-center gap-2">

            </h1>
            <p class="text-sm text-slate-400 mt-1">點擊左側程式碼的任意行數，即可查看該行的詳細語法與邏輯說明。</p>
        </div>
        
        <!-- 切換頁籤按鈕 -->
        <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
            <button id="tab-btn-1" onclick="switchExample(1)" class="px-4 py-2 text-sm font-semibold rounded-md transition-all bg-cyan-600 text-white shadow">

    </header>

            <div id="code-board" class="code-container p-2 overflow-x-auto max-h-[600px] overflow-y-auto">

            </div>
        </div>

                <i class="fa-solid fa-lightbulb"></i> 逐行程式解說
            </h2>

                <!-- 觀念補充小提示 -->
            </div>
        </div>

    </main>

    </footer>

                19: { title: "第 19 行：學生特惠價格輸出", body: "<code>cout &lt;&lt; \"符合學生優惠！門票價格為：150 元\" &lt;&lt; endl;</code><br>印出 150 元門票。", tip: "" },
                20: { title: "第 20 行：第二層 Else", body: "<code>} else {</code><br>年齡在 12~64 歲，但沒有學生證的情況。", tip: "" },
                21: { title: "第 21 行：一般成人票價格輸出", body: "<code>cout &lt;&lt; \"一般成人票，門票價格為：250 元\" &lt;&lt; endl;</code><br>印出成人票價 250 元。", tip: "" },
                22: { title: "第 22 行：第二層 If/Else 結束", body: "<code>}</code><br>結束內層選擇結構。", tip: "" },
                23: { title: "第 23 行：空白行", body: "區塊內排版。", tip: "" },
                24: { title: "第 24 行：第一層 Else", body: "<code>} else {</code><br>年齡<b>不滿足</b> 12~64 歲時進入此處。", tip: "💡 隱含條件：代表未滿 12 歲或達到 65 歲以上。" },
                25: { title: "第 25 行：單行註解", body: "<code>// 未滿 12 歲或 65 歲（含）以上直接享有特惠票</code><br>說明特惠票適用對象。", tip: "" },
                26: { title: "第 26 行：兒童/敬老特惠價格輸出", body: "<code>cout &lt;&lt; \"符合兒童/敬老特惠！門票價格為：100 元\" &lt;&lt; endl;</code><br>印出 100 元特惠票價。", tip: "" },
                27: { title: "第 27 行：第一層 If/Else 結束", body: "<code>}</code><br>結束外層選擇結構。", tip: "" },
                28: { title: "第 28 行：空白行", body: "排版空行。", tip: "" },
                29: { title: "第 29 行：回傳正常結束訊號", body: "<code>return 0;</code><br>程式正常執行完成。", tip: "" },
                30: { title: "第 30 行：Main 函式結束", body: "<code>}</code><br>主程式右大括號結束點。", tip: "" }
            }
        };

        let currentExample = example1;

        // 渲染程式碼面板
        function renderCode() {
            const board = document.getElementById('code-board');
            document.getElementById('file-name').innerHTML = `<i class="fa-regular fa-file-code text-blue-600"></i> ${currentExample.fileName}`;
            
            let html = '';
            currentExample.code.forEach(item => {
                const indentClass = item.indent > 0 ? `pl-${item.indent}` : '';
                html += `
                    <div class="code-line" onclick="explainLine(${item.num}, this)">
                        <span class="line-num">${item.num}</span>
                        <span class="${indentClass}">${item.text}</span>
                    </div>
                `;
            });
            board.innerHTML = html;

            // 預設重置說明卡片
            document.getElementById('line-title').innerText = "請點擊左側程式碼行數";
            document.getElementById('line-body').innerText = "點擊左方程式碼中的任意行數，此處將同步呈現該行程式碼的詳細功能、語法細節與邏輯觀念！";
            document.getElementById('line-tip').classList.add('hidden');
        }

        // 逐行解說點擊事件
        function explainLine(lineNum, element) {
            document.querySelectorAll('.code-line').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            const data = currentExample.explanations[lineNum];
            const titleEl = document.getElementById('line-title');
            const bodyEl = document.getElementById('line-body');
            const tipEl = document.getElementById('line-tip');

            if (data) {
                titleEl.innerHTML = data.title;
                bodyEl.innerHTML = data.body;
                if (data.tip) {
                    tipEl.innerHTML = data.tip;
                    tipEl.classList.remove('hidden');
                } else {
                    tipEl.classList.add('hidden');
                }
            }
        }

        // 切換範例頁籤
        function switchExample(id) {
            const btn1 = document.getElementById('tab-btn-1');
            const btn2 = document.getElementById('tab-btn-2');

            if (id === 1) {
                currentExample = example1;
                btn1.className = "px-4 py-2 text-sm font-semibold rounded-md transition-all bg-cyan-600 text-white shadow";
                btn2.className = "px-4 py-2 text-sm font-semibold rounded-md transition-all text-slate-400 hover:text-white";
            } else {
                currentExample = example2;
                btn2.className = "px-4 py-2 text-sm font-semibold rounded-md transition-all bg-cyan-600 text-white shadow";
                btn1.className = "px-4 py-2 text-sm font-semibold rounded-md transition-all text-slate-400 hover:text-white";
            }
            renderCode();
        }

        // 初始化
        renderCode();
    </script>
</body>
</html>
